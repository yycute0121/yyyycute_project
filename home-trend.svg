<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Q版本月收支趋势图标：折线图 + 上升趋势 -->
  <defs>
    <linearGradient id="trend-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 坐标轴 -->
  <line x1="6" y1="42" x2="44" y2="42" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="42" x2="6" y2="6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 网格虚线 -->
  <line x1="6" y1="32" x2="44" y2="32" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="6" y1="22" x2="44" y2="22" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="6" y1="12" x2="44" y2="12" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 2"/>
  <!-- 面积填充 -->
  <path d="M 10 32 L 18 24 L 26 28 L 34 16 L 42 10 L 42 42 L 10 42 Z" fill="url(#trend-area)"/>
  <!-- 折线 -->
  <path d="M 10 32 L 18 24 L 26 28 L 34 16 L 42 10"
        fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 数据点（最后一个最显眼） -->
  <circle cx="10" cy="32" r="2" fill="#fff" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="18" cy="24" r="2" fill="#fff" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="26" cy="28" r="2" fill="#fff" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="34" cy="16" r="2" fill="#fff" stroke="#6366f1" stroke-width="1.5"/>
  <!-- 最后一个点带笑脸 -->
  <circle cx="42" cy="10" r="4" fill="#6366f1" stroke="#4338ca" stroke-width="1.5"/>
  <circle cx="40.5" cy="9.5" r="0.6" fill="#fff"/>
  <circle cx="43.5" cy="9.5" r="0.6" fill="#fff"/>
  <path d="M 40.5 11.5 Q 42 12.5 43.5 11.5" stroke="#fff" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  <!-- 上升箭头 -->
  <g transform="translate(38 4)">
    <path d="M 0 4 L 4 0 L 8 4 M 4 0 L 4 6" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
