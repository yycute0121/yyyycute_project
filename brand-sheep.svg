<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <rect width="48" height="48" fill="none" stroke="none"/>

  <!-- ☁️云朵本体（5个大圆叠加，底部椭圆修平） -->
  <circle cx="13" cy="22" r="6.5" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  <circle cx="20" cy="17" r="8"   fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  <circle cx="28" cy="17" r="8"   fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  <circle cx="35" cy="22" r="6.5" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  <circle cx="24" cy="24" r="7"   fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  <!-- 底部扁平化 -->
  <rect x="6" y="24" width="36" height="18" rx="4" fill="#ffffff" stroke="none"/>

  <!-- 云朵上空隙遮盖（让顶部是云朵形，底部平滑） -->
  <path d="M 6 28 Q 6 40 24 40 Q 42 40 42 28" fill="#ffffff" stroke="#3498db" stroke-width="2"/>

  <!-- 小耳朵（粉内耳） -->
  <ellipse cx="10" cy="22" rx="2.5" ry="3.5" fill="#ffffff" stroke="#3498db" stroke-width="1.8" transform="rotate(-20 10 22)"/>
  <ellipse cx="38" cy="22" rx="2.5" ry="3.5" fill="#ffffff" stroke="#3498db" stroke-width="1.8" transform="rotate(20 38 22)"/>
  <ellipse cx="10.5" cy="22.5" rx="1" ry="1.5" fill="#fce4ec" stroke="none" transform="rotate(-20 10.5 22.5)"/>
  <ellipse cx="37.5" cy="22.5" rx="1" ry="1.5" fill="#fce4ec" stroke="none" transform="rotate(20 37.5 22.5)"/>

  <!-- 眯眯笑眼 -->
  <path d="M17 28 Q19 25.5 21 28" fill="none" stroke="#2c3e50" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M27 28 Q29 25.5 31 28" fill="none" stroke="#2c3e50" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 腮红 -->
  <ellipse cx="14" cy="32" rx="2.5" ry="1.8" fill="#f8bbd0" stroke="none" opacity="0.8"/>
  <ellipse cx="34" cy="32" rx="2.5" ry="1.8" fill="#f8bbd0" stroke="none" opacity="0.8"/>

  <!-- 微笑嘴 -->
  <path d="M22 34 Q24 36 26 34" fill="none" stroke="#2c3e50" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 金色小铃铛 -->
  <circle cx="24" cy="42" r="2.5" fill="#f1c40f" stroke="#e67e22" stroke-width="1.2"/>
  <circle cx="23" cy="41.2" r="0.8" fill="#fff" stroke="none" opacity="0.6"/>
  <line x1="22.5" y1="43.5" x2="25.5" y2="43.5" stroke="#e67e22" stroke-width="1"/>
</svg>