<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Q版最近交易图标：小票 -->
  <defs>
    <linearGradient id="receipt-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- 主体（带波浪边的小票） -->
  <path d="M 12 6 L 36 6 L 36 40 Q 33 38 30 40 Q 27 42 24 40 Q 21 38 18 40 Q 15 42 12 40 Z"
        fill="url(#receipt-grad)" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- 顶部装订线 -->
  <circle cx="24" cy="10" r="1.5" fill="#64748b"/>
  <!-- 小票内容线条（虚线模拟） -->
  <line x1="16" y1="16" x2="32" y2="16" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="21" x2="32" y2="21" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"/>
  <line x1="16" y1="26" x2="28" y2="26" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"/>
  <!-- 笑脸眼睛（眯眼） -->
  <path d="M 18 31 Q 19.5 30 21 31" stroke="#475569" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M 27 31 Q 28.5 30 30 31" stroke="#475569" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- 腮红 -->
  <circle cx="16.5" cy="34" r="1.4" fill="#fda4af" opacity="0.7"/>
  <circle cx="31.5" cy="34" r="1.4" fill="#fda4af" opacity="0.7"/>
  <!-- 微笑嘴 -->
  <path d="M 21 35 Q 24 37 27 35" stroke="#475569" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- 右下角小钱币点缀 -->
  <g transform="translate(36 4)">
    <circle cx="0" cy="0" r="5" fill="#fbbf24" stroke="#d97706" stroke-width="1.3"/>
    <text x="0" y="2" text-anchor="middle" font-size="6" font-weight="bold" fill="#92400e">¥</text>
  </g>
</svg>
