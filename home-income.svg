<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Q版收入图标：钱币 + 上箭头 -->
  <defs>
    <linearGradient id="income-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <!-- 钱币主体 -->
  <circle cx="24" cy="28" r="13" fill="url(#income-grad)" stroke="#16a34a" stroke-width="1.8"/>
  <circle cx="24" cy="28" r="9" fill="none" stroke="#16a34a" stroke-width="1.5" opacity="0.6"/>
  <!-- 钱币符号 ¥ -->
  <path d="M 19 24 L 29 24 M 24 24 L 24 33 M 20.5 27.5 L 27.5 27.5 M 20.5 30 L 27.5 30" stroke="#15803d" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- 笑眯眯的眼睛 -->
  <circle cx="20" cy="22" r="0.9" fill="#15803d"/>
  <circle cx="28" cy="22" r="0.9" fill="#15803d"/>
  <!-- 腮红 -->
  <circle cx="17" cy="26" r="1.8" fill="#fca5a5" opacity="0.7"/>
  <circle cx="31" cy="26" r="1.8" fill="#fca5a5" opacity="0.7"/>
  <!-- 上箭头 -->
  <g transform="translate(34 6)">
    <path d="M 6 14 L 6 4 M 2 8 L 6 4 L 10 8" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="6" cy="6" r="5" fill="#22c55e" opacity="0.15"/>
  </g>
</svg>
