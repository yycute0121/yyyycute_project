<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Q版支出图标：钱币 + 下箭头 -->
  <defs>
    <linearGradient id="expense-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <!-- 钱币主体 -->
  <circle cx="24" cy="22" r="13" fill="url(#expense-grad)" stroke="#ea580c" stroke-width="1.8"/>
  <circle cx="24" cy="22" r="9" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.6"/>
  <!-- 钱币符号 ¥ -->
  <path d="M 19 18 L 29 18 M 24 18 L 24 27 M 20.5 21.5 L 27.5 21.5 M 20.5 24 L 27.5 24" stroke="#c2410c" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- 笑眯眯的眼睛（眯眼） -->
  <path d="M 18.5 16 Q 20 14.5 21.5 16" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 26.5 16 Q 28 14.5 29.5 16" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- 腮红 -->
  <circle cx="17" cy="20" r="1.8" fill="#fda4af" opacity="0.7"/>
  <circle cx="31" cy="20" r="1.8" fill="#fda4af" opacity="0.7"/>
  <!-- 微笑嘴 -->
  <path d="M 21 24 Q 24 26 27 24" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- 下箭头 -->
  <g transform="translate(34 30)">
    <path d="M 6 2 L 6 12 M 2 8 L 6 12 L 10 8" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="6" cy="7" r="5" fill="#f97316" opacity="0.15"/>
  </g>
</svg>
