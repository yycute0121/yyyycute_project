<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Q版整库备份图标：小箱子 -->
  <defs>
    <linearGradient id="box-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- 箱体 -->
  <rect x="8" y="16" width="32" height="24" rx="4" fill="url(#box-grad)" stroke="#d97706" stroke-width="1.8"/>
  <!-- 箱盖 -->
  <rect x="6" y="10" width="36" height="8" rx="3" fill="#fcd34d" stroke="#d97706" stroke-width="1.8"/>
  <!-- 锁扣 -->
  <rect x="20" y="14" width="8" height="6" rx="2" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="24" cy="17" r="1.2" fill="#d97706"/>
  <!-- 笑脸眼睛 -->
  <path d="M 16 26 Q 17 25 18 26" stroke="#92400e" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M 30 26 Q 31 25 32 26" stroke="#92400e" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- 腮红 -->
  <circle cx="14" cy="30" r="1.2" fill="#fda4af" opacity="0.7"/>
  <circle cx="34" cy="30" r="1.2" fill="#fda4af" opacity="0.7"/>
  <!-- 微笑嘴 -->
  <path d="M 20 31 Q 24 33 28 31" stroke="#92400e" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- 小爱心点缀 -->
  <g transform="translate(38 8)">
    <path d="M 0 1.5 C 0 0 1.5 0 1.5 1.5 C 1.5 0 3 0 3 1.5 C 3 3 1.5 3.5 1.5 3.5 C 1.5 3.5 0 3 0 1.5 Z" fill="#f472b6"/>
  </g>
</svg>
