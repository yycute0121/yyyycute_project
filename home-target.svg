<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Q版预算概览图标：靶心 + 箭 -->
  <defs>
    <radialGradient id="target-grad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
  </defs>
  <!-- 靶心外圈 -->
  <circle cx="22" cy="26" r="16" fill="#fed7aa" stroke="#ea580c" stroke-width="1.8"/>
  <!-- 靶心中圈 -->
  <circle cx="22" cy="26" r="11" fill="#fdba74" stroke="#ea580c" stroke-width="1.5"/>
  <!-- 靶心内圈 -->
  <circle cx="22" cy="26" r="6" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>
  <!-- 靶心红点 -->
  <circle cx="22" cy="26" r="2.5" fill="#dc2626"/>
  <!-- 笑眯眯的脸（在中心红点上） -->
  <path d="M 20 25.5 Q 21 24.8 22 25.5" stroke="#fff" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  <path d="M 22 25.5 Q 23 24.8 24 25.5" stroke="#fff" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  <path d="M 21 27 Q 22 27.5 23 27" stroke="#fff" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  <!-- 箭（斜插右上） -->
  <line x1="22" y1="26" x2="40" y2="8" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- 箭头 -->
  <path d="M 40 8 L 36 10 L 38 12 Z M 40 8 L 38 6 L 40 4 Z" fill="#1e293b"/>
  <!-- 箭羽 -->
  <path d="M 36 12 L 33 15 L 35 17 L 38 14 Z" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
  <!-- 小星星点缀 -->
  <g transform="translate(8 10)">
    <path d="M 0 -3 L 1 -1 L 3 0 L 1 1 L 0 3 L -1 1 L -3 0 L -1 -1 Z" fill="#facc15" opacity="0.85"/>
  </g>
</svg>
