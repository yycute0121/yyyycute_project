<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Q版整库恢复图标：小包裹/信封 -->
  <defs>
    <linearGradient id="env-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- 信封主体 -->
  <rect x="6" y="12" width="36" height="28" rx="4" fill="url(#env-grad)" stroke="#2563eb" stroke-width="1.8"/>
  <!-- 信封翻盖（V形） -->
  <path d="M 6 16 L 24 28 L 42 16" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- 小爱心封印 -->
  <g transform="translate(20 22)">
    <path d="M 0 2 C 0 0 2 0 2 2 C 2 0 4 0 4 2 C 4 4 2 5 2 5 C 2 5 0 4 0 2 Z" fill="#f472b6" stroke="#db2777" stroke-width="0.8"/>
  </g>
  <!-- 笑脸眼睛 -->
  <path d="M 14 32 Q 15 31 16 32" stroke="#1e40af" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M 32 32 Q 33 31 34 32" stroke="#1e40af" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- 腮红 -->
  <circle cx="12" cy="35" r="1.2" fill="#fda4af" opacity="0.7"/>
  <circle cx="36" cy="35" r="1.2" fill="#fda4af" opacity="0.7"/>
  <!-- 微笑嘴 -->
  <path d="M 20 36 Q 24 38 28 36" stroke="#1e40af" stroke-width="1.3" stroke-linecap="round" fill="none"/>
</svg>
